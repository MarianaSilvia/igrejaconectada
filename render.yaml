services:
  - type: web
    name: chatbot-whatsapp-loja
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: chatbot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /var/data
      - key: MESSAGE_RATE_LIMIT
        value: 30
      - key: MESSAGE_RATE_WINDOW_MS
        value: 600000
      - key: WHATSAPP_GRAPH_VERSION
        value: v20.0
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
